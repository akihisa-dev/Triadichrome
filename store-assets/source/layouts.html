<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Triadichrome</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif;
      color: #202020;
      background: #fafafa;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    section { overflow: hidden; margin: 0; background: #fafafa; }
    .brand { font-weight: 600; letter-spacing: -.035em; line-height: 1.2; }
    .small {
      width: 440px;
      height: 280px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .small img { width: 156px; height: 156px; }
    .small .brand { font-size: 34px; }
    .marquee {
      width: 1400px;
      height: 560px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 44px;
    }
    .marquee img { width: 330px; height: 330px; }
    .marquee .brand { font-size: 88px; }
  </style>
</head>
<body>
  <section id="promo-small" class="small">
    <img src="../../branding/logo.svg" alt="">
    <div class="brand">Triadichrome</div>
  </section>
  <section id="promo-marquee" class="marquee">
    <img src="../../branding/logo.svg" alt="">
    <div class="brand">Triadichrome</div>
  </section>
</body>
</html>
