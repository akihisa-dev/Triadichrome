<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/branding/icons/icon-32.png?no-inline" />
    <link rel="stylesheet" href="./preview.css" />
    <title>Triadichrome 画面テスト</title>
  </head>
  <body>
    <header class="test-toolbar">
      <div><strong>画面テスト</strong><span>ファイル操作はメモリ内で再現します。</span></div>
      <div class="scenario-control"><label for="dataset">テストデータ</label>
        <select id="dataset">
          <option value="full">機能確認用（14施策）</option>
          <option value="large">大規模全機能確認用（1,014施策）</option>
          <option value="defaults">デフォルトの新規計画</option>
          <option value="empty">空のマスタの計画</option>
          <option value="legacy">旧形式の空の計画</option>
          <option value="previous-export-limit">前年フォーマットの上限確認（330科目・18組）</option>
          <option value="overflow-monthly">上限超過：複数施策の月合計</option>
          <option value="overflow-period">上限超過：期間計</option>
          <option value="overflow-previous-input">上限超過：前年入力の分類合計</option>
          <option value="overflow-previous">上限超過：前年との合算</option>
          <option value="overflow-difference">上限超過：予算差額</option>
          <option value="overflow-initiative">上限超過：確定予算の施策内合計</option>
          <option value="overflow-normal">上限確認の通常額</option>
        </select>
      </div>
      <div class="scenario-control"><label for="scenario">ファイル操作</label>
        <select id="scenario">
          <option value="normal">正常</option>
          <option value="cancel">キャンセル</option>
          <option value="invalid">不正ファイル</option>
          <option value="save-failure">保存失敗</option>
          <option value="write-permission">読み取りのみ許可（開くときに書き込みを許可）</option>
          <option value="permission-denied">書き込み許可を拒否</option>
        </select>
      </div>
      <button id="reset" type="button">入口に戻す</button>
      <output id="status" role="status">準備中</output>
    </header>
    <iframe id="app-preview" title="Triadichromeの実装画面" inert></iframe>
    <script type="module" src="./preview.ts"></script>
  </body>
</html>
